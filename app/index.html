<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE MULTIVAC | AI Model Evaluation Command Center</title>
  <meta name="description" content="Peer-to-peer AI model evaluation through blind assessment protocol">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/ailerons" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E◈%3C/text%3E%3C/svg%3E">
  
  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0A0A0A;
      --bg-card: #111111;
      --bg-card-hover: #1A1A1A;
      --accent-primary: #8B5CF6;
      --accent-secondary: #6D28D9;
      --accent-glow: #A855F7;
      --text-primary: #FFFFFF;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
      --success: #22C55E;
      --warning: #F59E0B;
      --error: #EF4444;
      --border: #2D1B4E;
      --border-subtle: #1F1F1F;
    }
    
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
    }
    
    .ailerons {
      font-family: 'Ailerons', sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    
    .container {
      display: flex;
      min-height: 100vh;
      background: var(--bg-primary);
    }
    
    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }
    
    .logo {
      padding: 24px;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .logo-text {
      font-family: 'Ailerons', sans-serif;
      font-size: 20px;
      letter-spacing: 0.3em;
      color: var(--accent-primary);
      text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
    }
    
    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      margin-top: 4px;
    }
    
    .nav {
      flex: 1;
      padding: 16px 0;
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      border-left: 2px solid transparent;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    
    .nav-item:hover {
      background: rgba(139, 92, 246, 0.1);
      color: var(--text-primary);
      border-left-color: var(--accent-primary);
    }
    
    .nav-item.active {
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-primary);
      border-left-color: var(--accent-primary);
    }
    
    .nav-icon {
      width: 18px;
      text-align: center;
      font-size: 14px;
    }
    
    /* MAIN CONTENT */
    .main {
      flex: 1;
      margin-left: 240px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    .header {
      height: 60px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    
    .header-title {
      font-family: 'Ailerons', sans-serif;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .user-badge:hover {
      border-color: var(--border);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
    }
    
    .avatar {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }
    
    .content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }
    
    /* CARDS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      transition: all 0.15s ease;
    }
    
    .card:hover {
      border-color: var(--border);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.1);
    }
    
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    
    .card-title {
      font-family: 'Ailerons', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
    }
    
    /* STAT CARDS */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      border-left: 3px solid var(--accent-primary);
      transition: all 0.15s ease;
    }
    
    .stat-card:hover {
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
      transform: translateY(-2px);
    }
    
    .stat-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-family: 'Ailerons', sans-serif;
      font-size: 32px;
      color: var(--text-primary);
      letter-spacing: 0.1em;
    }
    
    .stat-change {
      font-size: 12px;
      margin-top: 8px;
    }
    
    .stat-change.positive {
      color: var(--success);
    }
    
    .stat-change.negative {
      color: var(--error);
    }
    
    /* TABLE */
    .table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .table-row {
      border-bottom: 1px solid var(--border-subtle);
      transition: all 0.15s ease;
      cursor: pointer;
    }
    
    .table-row:hover {
      background: rgba(139, 92, 246, 0.08);
    }
    
    .table-cell {
      padding: 16px;
      font-size: 13px;
    }
    
    .table-cell.id {
      color: var(--accent-primary);
      font-weight: 600;
      width: 100px;
    }
    
    .table-cell.date {
      color: var(--text-muted);
      width: 100px;
      text-align: right;
    }
    
    .table-cell.winner {
      color: var(--success);
    }
    
    /* LEADERBOARD */
    .leaderboard-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .leaderboard-rank {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }
    
    .leaderboard-rank.top {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
    }
    
    .leaderboard-model {
      flex: 1;
      font-size: 13px;
    }
    
    .leaderboard-bar-container {
      flex: 2;
      height: 20px;
      background: var(--bg-secondary);
      position: relative;
    }
    
    .leaderboard-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
      transition: width 0.5s ease;
    }
    
    .leaderboard-score {
      width: 60px;
      text-align: right;
      font-weight: 600;
      color: var(--accent-glow);
    }
    
    /* BUTTONS */
    .btn {
      padding: 12px 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      text-transform: uppercase;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
    }
    
    .btn-primary:hover {
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover {
      background: rgba(139, 92, 246, 0.1);
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }
    
    /* WINNER CARD */
    .winner-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(109, 40, 217, 0.1));
      border: 2px solid var(--accent-primary);
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
    }
    
    .winner-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-primary);
      color: white;
      padding: 6px 14px;
      font-size: 11px;
      letter-spacing: 0.15em;
      margin-bottom: 16px;
    }
    
    .winner-model {
      font-family: 'Ailerons', sans-serif;
      font-size: 28px;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    
    .winner-score {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    
    .winner-score-bar {
      flex: 1;
      height: 12px;
      background: var(--bg-card);
      max-width: 400px;
    }
    
    .winner-score-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary), var(--accent-glow));
    }
    
    .winner-score-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent-glow);
    }
    
    .winner-excerpt {
      color: var(--text-secondary);
      font-style: italic;
      font-size: 14px;
      line-height: 1.6;
      border-left: 2px solid var(--accent-primary);
      padding-left: 16px;
      margin-top: 16px;
    }
    
    /* PEER MATRIX */
    .matrix-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      overflow-x: auto;
    }
    
    .matrix-title {
      font-family: 'Ailerons', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    
    .matrix {
      display: grid;
      gap: 2px;
      min-width: 600px;
    }
    
    .matrix-cell {
      padding: 12px;
      text-align: center;
      font-size: 12px;
      transition: all 0.15s ease;
    }
    
    .matrix-cell.header {
      background: var(--bg-secondary);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.1em;
    }
    
    .matrix-cell.row-header {
      background: var(--bg-secondary);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 10px;
      text-align: left;
    }
    
    .matrix-cell.self {
      background: var(--bg-secondary);
      color: var(--text-muted);
    }
    
    .matrix-cell.score {
      background: var(--bg-secondary);
      cursor: pointer;
    }
    
    .matrix-cell.score:hover {
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
      z-index: 1;
      position: relative;
    }
    
    .matrix-cell.high {
      background: rgba(139, 92, 246, 0.3);
      color: var(--text-primary);
    }
    
    .matrix-cell.medium {
      background: rgba(139, 92, 246, 0.15);
      color: var(--text-primary);
    }
    
    .matrix-cell.low {
      background: rgba(139, 92, 246, 0.05);
      color: var(--text-secondary);
    }
    
    /* ANALYTICS */
    .analytics-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
    
    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 24px;
    }
    
    .chart-title {
      font-family: 'Ailerons', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    
    .chart-placeholder {
      height: 200px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .chart-bar {
      flex: 1;
      background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
      transition: height 0.5s ease;
      min-height: 20px;
    }
    
    .chart-labels {
      display: flex;
      justify-content: space-around;
      padding-top: 12px;
    }
    
    .chart-label {
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .win-rate-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .win-rate-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .win-rate-label {
      width: 80px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .win-rate-bar {
      flex: 1;
      height: 20px;
      background: var(--bg-secondary);
    }
    
    .win-rate-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
    }
    
    .win-rate-value {
      width: 45px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-glow);
    }
    
    /* MODELS PAGE */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    
    .model-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 20px;
      transition: all 0.15s ease;
    }
    
    .model-card:hover {
      border-color: var(--border);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
    }
    
    .model-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .model-card-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .model-card-info h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .model-card-info p {
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .model-card-pricing {
      background: var(--bg-secondary);
      padding: 12px;
      margin-bottom: 16px;
    }
    
    .pricing-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 4px 0;
    }
    
    .pricing-label {
      color: var(--text-muted);
    }
    
    .pricing-value {
      color: var(--text-secondary);
    }
    
    .model-card-actions {
      display: flex;
      gap: 8px;
    }
    
    .model-card-actions .btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 10px;
    }
    
    /* API KEYS */
    .api-keys-section {
      margin-top: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 20px;
    }
    
    .api-key-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .api-key-provider {
      width: 120px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .api-key-value {
      flex: 1;
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .api-key-status {
      font-size: 11px;
      padding: 4px 10px;
    }
    
    .api-key-status.valid {
      color: var(--success);
      background: rgba(34, 197, 94, 0.1);
    }
    
    .api-key-status.missing {
      color: var(--text-muted);
      background: var(--bg-secondary);
    }
    
    /* PROFILE PAGE */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 32px;
      padding: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }
    
    .profile-avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Ailerons', sans-serif;
      font-size: 24px;
      letter-spacing: 0.1em;
    }
    
    .profile-info h2 {
      font-family: 'Ailerons', sans-serif;
      font-size: 18px;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    
    .profile-info p {
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .usage-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .usage-label {
      width: 150px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .usage-bar {
      flex: 1;
      height: 8px;
      background: var(--bg-secondary);
    }
    
    .usage-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
    }
    
    .usage-value {
      width: 100px;
      text-align: right;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .preferences-grid {
      display: flex;
      flex-direction: column;
    }
    
    .preference-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .preference-label {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .preference-value {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .toggle {
      display: flex;
      background: var(--bg-secondary);
      padding: 2px;
    }
    
    .toggle-option {
      padding: 8px 16px;
      font-size: 11px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .toggle-option.active {
      background: var(--accent-primary);
      color: white;
    }
    
    .filter-select {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }
    
    /* WELCOME SECTION */
    .welcome {
      margin-bottom: 32px;
    }
    
    .welcome h1 {
      font-family: 'Ailerons', sans-serif;
      font-size: 28px;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    
    .welcome p {
      color: var(--text-muted);
      font-size: 14px;
    }
    
    /* HISTORY TABLE */
    .history-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      justify-content: center;
    }
    
    .page-btn {
      width: 32px;
      height: 32px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    
    .page-btn:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }
    
    .page-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
    }
    
    /* FOOTER */
    .footer {
      height: 40px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
