<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE MULTIVAC | AI Evaluation Command Center</title>
  <meta name="description" content="Peer-to-peer AI model evaluation through blind assessment protocol. One question. All frontier models. 10×10 peer matrix. Daily.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%238B5CF6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/ailerons" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg-primary:#000;
      --bg-secondary:#0A0A0A;
      --bg-card:#111;
      --bg-card-hover:#1A1A1A;
      --accent-primary:#8B5CF6;
      --accent-secondary:#6D28D9;
      --accent-glow:#A855F7;
      --accent-green:#22C55E;
      --accent-orange:#F59E0B;
      --accent-red:#EF4444;
      --accent-blue:#3B82F6;
      --text-primary:#FFF;
      --text-secondary:#A1A1AA;
      --text-muted:#71717A;
      --border:#2D1B4E;
      --border-subtle:#1F1F1F;
      --font-display:'Ailerons',sans-serif;
      --font-body:'Outfit',sans-serif;
      --font-mono:'JetBrains Mono',monospace;
    }
    html,body{height:100%;overflow:hidden}
    body{
      background:var(--bg-primary);
      color:var(--text-primary);
      font-family:var(--font-mono);
      min-height:100vh;
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:
        linear-gradient(90deg,rgba(139,92,246,0.03) 1px,transparent 1px),
        linear-gradient(rgba(139,92,246,0.03) 1px,transparent 1px);
      background-size:50px 50px;
      pointer-events:none;
      z-index:0;
    }
    #root{position:relative;z-index:1;height:100vh;display:flex}

    /* ── SIDEBAR ── */
    .sidebar{width:240px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;flex-shrink:0}
    .logo{padding:24px;border-bottom:1px solid var(--border-subtle)}
    .logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}
    .logo-text{font-family:var(--font-display);font-size:18px;letter-spacing:.3em;color:var(--accent-primary);text-shadow:0 0 20px rgba(139,92,246,.5)}
    .logo-sub{font-size:9px;color:var(--text-muted);letter-spacing:.2em;margin-top:4px;text-transform:uppercase}
    .nav{flex:1;padding:12px 0;overflow-y:auto}
    .nav-section-label{font-size:9px;color:var(--text-muted);letter-spacing:.2em;text-transform:uppercase;padding:16px 24px 6px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--text-secondary);cursor:pointer;transition:all .15s ease;border-left:2px solid transparent;font-size:12px;letter-spacing:.05em;text-decoration:none;user-select:none}
    .nav-item:hover{background:rgba(139,92,246,.1);color:var(--text-primary);border-left-color:rgba(139,92,246,.5)}
    .nav-item.active{background:rgba(139,92,246,.15);color:var(--accent-primary);border-left-color:var(--accent-primary)}
    .nav-icon{width:16px;text-align:center;font-size:14px;opacity:.8}
    .nav-badge{margin-left:auto;font-size:9px;padding:2px 6px;border-radius:2px;letter-spacing:.05em;background:rgba(34,197,94,.15);color:var(--accent-green)}
    .nav-badge.orange{background:rgba(245,158,11,.15);color:var(--accent-orange)}
    .sidebar-footer{padding:16px 24px;border-top:1px solid var(--border-subtle)}
    .sidebar-footer-text{font-size:10px;color:var(--text-muted);letter-spacing:.1em}

    /* ── MAIN ── */
    .main{flex:1;margin-left:240px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
    .header{height:56px;background:var(--bg-secondary);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0;z-index:50}
    .header-title{font-family:var(--font-display);font-size:13px;letter-spacing:.2em;color:var(--text-secondary)}
    .header-right{display:flex;align-items:center;gap:12px}
    .header-link{font-size:11px;color:var(--text-muted);text-decoration:none;letter-spacing:.1em;padding:6px 12px;border:1px solid var(--border-subtle);transition:all .15s ease}
    .header-link:hover{color:var(--text-primary);border-color:var(--accent-primary)}
    .status-dot{width:7px;height:7px;background:var(--accent-green);border-radius:50%;animation:pulse 2s infinite;display:inline-block;margin-right:6px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    .content{flex:1;padding:28px 32px;overflow-y:auto}

    /* ── CARDS & GRIDS ── */
    .card{background:var(--bg-card);border:1px solid var(--border-subtle);padding:24px;transition:all .15s ease}
    .card:hover{border-color:rgba(139,92,246,.2);box-shadow:0 0 30px rgba(139,92,246,.08)}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .card-title{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--text-secondary)}
    .card-action{font-size:11px;color:var(--accent-primary);cursor:pointer;letter-spacing:.05em;border:none;background:none;font-family:var(--font-mono)}
    .card-action:hover{text-decoration:underline}

    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .stat-card{background:var(--bg-card);border:1px solid var(--border-subtle);padding:20px;border-left:3px solid var(--accent-primary);transition:all .15s ease;cursor:default}
    .stat-card:hover{box-shadow:0 0 24px rgba(139,92,246,.15);transform:translateY(-1px)}
    .stat-card.green{border-left-color:var(--accent-green)}
    .stat-card.orange{border-left-color:var(--accent-orange)}
    .stat-card.blue{border-left-color:var(--accent-blue)}
    .stat-label{font-size:10px;letter-spacing:.15em;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase}
    .stat-value{font-family:var(--font-display);font-size:28px;color:var(--text-primary);letter-spacing:.05em}
    .stat-change{font-size:11px;margin-top:8px;color:var(--text-muted)}
    .stat-change.positive{color:var(--accent-green)}

    /* ── TABLE ── */
    .table{width:100%;border-collapse:collapse}
    .table-row{border-bottom:1px solid var(--border-subtle);transition:all .15s ease;cursor:pointer}
    .table-row:hover{background:rgba(139,92,246,.07)}
    .table-cell{padding:14px 16px;font-size:12px;vertical-align:middle}
    .table-cell.id{color:var(--accent-primary);font-weight:600;font-size:11px;width:110px}
    .table-cell.date{color:var(--text-muted);width:80px;text-align:right;font-size:11px}
    .table-cell.winner{color:var(--accent-green)}
    .table-cell.category{color:var(--accent-glow);font-size:10px;text-transform:uppercase;letter-spacing:.08em;width:130px}
    .table-cell.score{color:var(--accent-primary);font-weight:600;width:60px;text-align:right}
    .table-cell.question-preview{color:var(--text-secondary);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    .th{padding:10px 16px;font-size:9px;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase;text-align:left;border-bottom:1px solid var(--border-subtle)}

    /* ── LEADERBOARD ── */
    .leaderboard-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-subtle)}
    .leaderboard-rank{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-muted);flex-shrink:0}
    .leaderboard-rank.top{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff;font-size:12px}
    .leaderboard-model{min-width:180px}
    .leaderboard-model-name{font-size:13px;color:var(--text-primary);margin-bottom:2px}
    .leaderboard-model-sub{font-size:10px;color:var(--text-muted)}
    .leaderboard-bar-container{flex:1;height:8px;background:var(--bg-secondary)}
    .leaderboard-bar{height:100%;background:linear-gradient(90deg,var(--accent-secondary),var(--accent-primary),var(--accent-glow));transition:width .6s ease}
    .leaderboard-score{width:54px;text-align:right;font-weight:600;color:var(--accent-glow);font-size:13px}
    .leaderboard-wins{width:60px;text-align:right;font-size:11px;color:var(--text-muted)}

    /* ── WINNER CARD ── */
    .winner-card{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(109,40,217,.08));border:1px solid rgba(139,92,246,.4);padding:28px;margin-bottom:24px;box-shadow:0 0 40px rgba(139,92,246,.15)}
    .winner-badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-primary);color:#fff;padding:5px 12px;font-size:10px;letter-spacing:.15em;margin-bottom:14px;text-transform:uppercase}
    .winner-model{font-family:var(--font-display);font-size:24px;letter-spacing:.1em;margin-bottom:10px}
    .winner-score-row{display:flex;align-items:center;gap:16px;margin-bottom:14px}
    .winner-score-bar{flex:1;height:10px;background:var(--bg-card);max-width:360px}
    .winner-score-fill{height:100%;background:linear-gradient(90deg,var(--accent-secondary),var(--accent-primary),var(--accent-glow))}
    .winner-score-value{font-size:22px;font-weight:700;color:var(--accent-glow)}
    .winner-question{font-size:12px;color:var(--text-secondary);border-left:2px solid var(--accent-primary);padding-left:14px;font-style:italic}

    /* ── BUTTONS ── */
    .btn{padding:10px 20px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;cursor:pointer;transition:all .15s ease;border:none;text-transform:uppercase}
    .btn-primary{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff;box-shadow:0 0 16px rgba(139,92,246,.3)}
    .btn-primary:hover{box-shadow:0 0 32px rgba(139,92,246,.5);transform:translateY(-1px)}
    .btn-secondary{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
    .btn-secondary:hover{background:rgba(139,92,246,.1);color:var(--text-primary);border-color:var(--accent-primary)}

    /* ── FILTERS ── */
    .filter-select{background:var(--bg-secondary);border:1px solid var(--border-subtle);padding:8px 12px;color:var(--text-primary);font-family:var(--font-mono);font-size:11px;cursor:pointer;outline:none;letter-spacing:.05em}
    .filter-select:focus{border-color:var(--accent-primary)}

    /* ── PAGINATION ── */
    .pagination{display:flex;align-items:center;gap:6px;margin-top:18px;justify-content:center}
    .page-btn{width:30px;height:30px;background:var(--bg-secondary);border:1px solid var(--border-subtle);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;font-family:var(--font-mono);font-size:12px}
    .page-btn:hover{border-color:var(--accent-primary);color:var(--text-primary)}
    .page-btn.active{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff}

    /* ── WELCOME ── */
    .welcome{margin-bottom:28px}
    .welcome h1{font-family:var(--font-display);font-size:24px;letter-spacing:.1em;margin-bottom:6px}
    .welcome p{color:var(--text-muted);font-size:12px;letter-spacing:.05em}

    /* ── ANALYTICS BARS ── */
    .win-rate-item{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .win-rate-label{font-size:11px;color:var(--text-secondary);min-width:90px;text-transform:uppercase;letter-spacing:.05em}
    .win-rate-bar{flex:1;height:8px;background:var(--bg-secondary)}
    .win-rate-fill{height:100%;background:linear-gradient(90deg,var(--accent-secondary),var(--accent-primary));transition:width .5s ease}
    .win-rate-value{font-size:11px;color:var(--accent-glow);min-width:36px;text-align:right;font-weight:600}

    /* ── HOME / ARCHIVE PAGE ── */
    .home-hero{text-align:center;padding:40px 0 32px}
    .hero-title{font-family:var(--font-display);font-size:3.2rem;letter-spacing:.15em;text-transform:uppercase;background:linear-gradient(135deg,var(--text-primary) 0%,var(--accent-primary) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
    .hero-tagline{font-family:var(--font-mono);font-size:.85rem;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:20px}
    .hero-desc{font-family:var(--font-body);font-size:1rem;color:var(--text-secondary);max-width:560px;margin:0 auto 24px;line-height:1.7;font-weight:300}
    .hero-desc strong{color:var(--text-primary);font-weight:500}
    .hero-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
    .hero-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-family:var(--font-body);font-size:.9rem;font-weight:600;color:#fff;background:var(--accent-primary);border:none;text-decoration:none;cursor:pointer;transition:all .2s ease;box-shadow:0 4px 20px rgba(139,92,246,.3)}
    .hero-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(139,92,246,.4)}
    .hero-btn.outline{background:transparent;border:1px solid var(--accent-primary);box-shadow:none}
    .hero-btn.outline:hover{background:rgba(139,92,246,.1)}
    .hero-stats{display:flex;justify-content:center;gap:40px;padding:20px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);margin-bottom:32px}
    .hero-stat-value{font-family:var(--font-display);font-size:2rem;color:var(--accent-primary)}
    .hero-stat-label{font-size:10px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

    .phase-tabs-row{display:flex;border-bottom:1px solid var(--border-subtle);margin-bottom:20px}
    .phase-tab-btn{padding:10px 20px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:all .2s ease}
    .phase-tab-btn:hover{color:var(--text-primary)}
    .phase-tab-btn.active{color:var(--accent-primary);border-bottom-color:var(--accent-primary)}
    .tab-badge-pill{display:inline-block;padding:1px 7px;font-size:9px;border-radius:2px;margin-left:6px;vertical-align:middle}
    .tab-badge-pill.live{background:rgba(34,197,94,.15);color:var(--accent-green)}
    .tab-badge-pill.done{background:rgba(255,255,255,.07);color:var(--text-muted)}

    .archive-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .archive-title{font-family:var(--font-display);font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase}

    .question-card{display:block;background:var(--bg-card);border:1px solid var(--border-subtle);padding:18px 20px;transition:all .2s ease;text-decoration:none;margin-bottom:10px}
    .question-card:hover{border-color:rgba(139,92,246,.3);transform:translateX(4px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
    .question-card.phase2:hover{border-color:rgba(34,197,94,.3)}
    .question-meta-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
    .q-num{font-family:var(--font-mono);font-size:10px;color:var(--accent-primary);background:rgba(139,92,246,.15);padding:3px 8px}
    .q-num.green{color:var(--accent-green);background:rgba(34,197,94,.12)}
    .q-cat{font-family:var(--font-mono);font-size:9px;color:var(--accent-orange);background:rgba(245,158,11,.12);padding:3px 8px;text-transform:uppercase}
    .q-cat.red{color:var(--accent-red);background:rgba(239,68,68,.12)}
    .q-cat.blue{color:var(--accent-blue);background:rgba(59,130,246,.12)}
    .q-date{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
    .q-winner-pill{margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--accent-orange);background:rgba(245,158,11,.1);padding:3px 8px;display:flex;align-items:center;gap:4px}
    .q-title{font-family:var(--font-body);font-size:1rem;font-weight:500;color:var(--text-primary);line-height:1.4;margin-bottom:4px}
    .q-subtitle{font-family:var(--font-body);font-size:.85rem;color:var(--text-secondary);line-height:1.5;margin-bottom:8px}
    .q-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--accent-primary);text-decoration:none;letter-spacing:.05em}
    .q-link.green{color:var(--accent-green)}
    .q-link:hover{text-decoration:underline}

    .asimov-quote{margin-top:32px;padding:20px 24px;background:var(--bg-card);border-left:3px solid var(--accent-primary);border-right:1px solid var(--border-subtle);border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
    .asimov-quote p{font-family:var(--font-body);font-style:italic;color:var(--text-secondary);font-size:.9rem;line-height:1.7}
    .asimov-quote cite{display:block;margin-top:8px;font-family:var(--font-mono);font-size:.75rem;color:var(--text-muted)}

    /* ── MODELS PAGE ── */
    .models-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .model-card{background:var(--bg-card);border:1px solid var(--border-subtle);padding:20px;transition:all .15s ease}
    .model-card:hover{border-color:rgba(139,92,246,.3);box-shadow:0 0 24px rgba(139,92,246,.1)}
    .model-card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .model-card-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .model-card-name{font-size:13px;font-weight:600;margin-bottom:2px}
    .model-card-key{font-size:10px;color:var(--text-muted)}
    .model-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg-secondary);padding:12px}
    .model-stat-item{font-size:10px}
    .model-stat-label{color:var(--text-muted);margin-bottom:2px;letter-spacing:.08em}
    .model-stat-value{font-weight:600;color:var(--text-primary)}
    .model-stat-value.green{color:var(--accent-green)}
    .model-stat-value.purple{color:var(--accent-glow)}
    .win-rate-pill{display:inline-block;padding:2px 8px;font-size:10px;margin-top:10px}
    .win-rate-pill.high{background:rgba(34,197,94,.12);color:var(--accent-green)}
    .win-rate-pill.low{background:rgba(113,113,122,.12);color:var(--text-muted)}

    /* ── CATEGORY BREAKDOWN ── */
    .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .cat-card{background:var(--bg-secondary);padding:16px;border-left:3px solid var(--accent-primary)}
    .cat-name{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
    .cat-count{font-family:var(--font-display);font-size:22px;margin-bottom:4px}
    .cat-top{font-size:11px;color:var(--accent-green)}

    /* ── RESULT DETAIL ── */
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}

    /* ── FOOTER BAR ── */
    .footer{height:36px;background:var(--bg-secondary);border-top:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:10px;color:var(--text-muted);letter-spacing:.08em;flex-shrink:0}

    /* ── ANIMATIONS ── */
    .animate-in{animation:fadeSlideIn .3s ease forwards;opacity:0}
    .animate-delay-1{animation-delay:.05s}
    .animate-delay-2{animation-delay:.1s}
    .animate-delay-3{animation-delay:.15s}
    .animate-delay-4{animation-delay:.2s}
    @keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* ── RESPONSIVE ── */
    @media(max-width:900px){
      .sidebar{width:56px}
      .sidebar .logo-text,.sidebar .logo-sub,.sidebar .nav-section-label,
      .nav-item span:not(.nav-icon),.sidebar .nav-badge,.sidebar-footer{display:none}
      .nav-item{padding:14px;justify-content:center}
      .main{margin-left:56px}
      .stat-grid{grid-template-columns:repeat(2,1fr)}
      .cat-grid{grid-template-columns:repeat(2,1fr)}
      .hero-title{font-size:2rem}
    }
    @media(max-width:600px){
      .stat-grid{grid-template-columns:1fr}
      .detail-grid{grid-template-columns:1fr}
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar{width:4px;height:4px}

              {label:'Date', value:ev.date},
            ].map(item => (
              <div key={item.label}>
                <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:4,letterSpacing:'.1em',textTransform:'uppercase'}}>{item.label}</div>
                <div style={{fontSize:12,color:item.color||'var(--text-primary)'}}>{item.value}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Other evals in same category */}
      <div className="card animate-in animate-delay-3">
        <div className="card-header">
          <span className="card-title">Other Evaluations in {ev.category.replace('_',' ').toUpperCase()}</span>
          <button className="card-action" onClick={() => setActive('history')}>View All</button>
        </div>
        <table className="table">
          <tbody>
            {catEvals.filter(e => e.id !== ev.id).slice(0,6).map(e => (
              <tr key={e.id} className="table-row">
                <td className="table-cell id">{e.question_id}</td>
                <td className="table-cell question-preview">{e.question}</td>
                <td className="table-cell winner">{e.winner}</td>
                <td className="table-cell score">{e.score.toFixed(1)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
};

/* ══════════════════════════════════════════════════
   HISTORY PAGE
══════════════════════════════════════════════════ */
const History = ({setActive, setSelectedEval}) => {
  const [filter, setFilter] = useState('all');
  const [page, setPage] = useState(1);
  const perPage = 15;

  const cats = ['all', ...Object.keys(TRACKER_DATA.categories)];
  const filtered = filter === 'all'
    ? TRACKER_DATA.evaluations
    : TRACKER_DATA.evaluations.filter(e => e.category === filter);

  const totalPages = Math.ceil(filtered.length / perPage);
  const paginated = filtered.slice((page-1)*perPage, page*perPage);

  return (
    <>
      <div className="welcome animate-in" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
        <div>
          <h1>Evaluation History</h1>
          <p>All {TRACKER_DATA.total_evaluations} peer evaluations · 10×10 matrix · blind assessment</p>
        </div>
        <select
          className="filter-select"
          value={filter}
          onChange={e => { setFilter(e.target.value); setPage(1); }}
        >
          {cats.map(cat => (
            <option key={cat} value={cat}>
              {cat === 'all' ? 'All Categories' : cat.replace('_',' ')}
            </option>
          ))}
        </select>
      </div>

      <div className="card animate-in animate-delay-1">
        <table className="table">
          <thead>
            <tr>
              {['Question','Preview','Category','Winner','Score','Date'].map(h => (
                <th key={h} className="th">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {paginated.map(ev => (
              <tr
                key={ev.id}
                className="table-row"
                onClick={() => { setSelectedEval(ev); setActive('results'); }}
              >
                <td className="table-cell id">{ev.question_id}</td>
                <td className="table-cell question-preview">{ev.question}</td>
                <td className="table-cell category">{ev.category.replace('_',' ')}</td>
                <td className="table-cell winner">{ev.winner}</td>
                <td className="table-cell score">{ev.score.toFixed(1)}</td>
                <td className="table-cell date">{ev.display_date}</td>
              </tr>
            ))}
          </tbody>
        </table>

        {totalPages > 1 && (
          <div className="pagination">
            {[...Array(totalPages)].map((_,i) => (
              <button
                key={i}
                className={`page-btn${page===i+1?' active':''}`}
                onClick={() => setPage(i+1)}
              >{i+1}</button>
            ))}
          </div>
        )}
      </div>
    </>
  );
};

/* ══════════════════════════════════════════════════
   LEADERBOARD PAGE
══════════════════════════════════════════════════ */
const Leaderboard = () => {
  const [sortBy, setSortBy] = useState('score');
  const sorted = [...TRACKER_DATA.leaderboard].sort((a,b) => {
    if (sortBy === 'wins') return b.wins - a.wins;
    if (sortBy === 'evaluations') return b.evaluations - a.evaluations;
    return b.score - a.score;
  });
  const maxScore = Math.max(...sorted.map(m => m.score));

  return (
    <>
      <div className="welcome animate-in" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
        <div>
          <h1>Model Leaderboard</h1>
          <p>Rankings across {TRACKER_DATA.total_evaluations} blind evaluations · {TRACKER_DATA.stats.models_tested} models</p>
        </div>
        <select className="filter-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
          <option value="score">Sort: Avg Score</option>
          <option value="wins">Sort: Wins</option>
          <option value="evaluations">Sort: Evaluations</option>
        </select>
      </div>

      <div className="card animate-in animate-delay-1" style={{marginBottom:20}}>
        {sorted.map((m, i) => (
          <div key={m.model_key} className="leaderboard-item">
            <div className={`leaderboard-rank${i===0?' top':''}`}>{i+1}</div>
            <div className="leaderboard-model" style={{minWidth:200}}>
              <div className="leaderboard-model-name">{m.model}</div>
              <div className="leaderboard-model-sub">{m.evaluations} evals · {((m.wins/m.evaluations)*100).toFixed(0)}% win rate</div>
            </div>
            <div className="leaderboard-bar-container">
              <div className="leaderboard-bar" style={{width:`${(m.score/maxScore)*100}%`}}/>
            </div>
            <div className="leaderboard-score">{m.score.toFixed(2)}</div>
            <div className="leaderboard-wins">{m.wins} wins</div>
          </div>
        ))}
      </div>

      {/* Category specialists */}
      <div className="card animate-in animate-delay-2">
        <div className="card-header">
          <span className="card-title">Category Specialists</span>
        </div>
        <div className="cat-grid">
          {Object.entries(TRACKER_DATA.categories).map(([cat, data]) => (
            <div key={cat} className="cat-card">
              <div className="cat-name">{cat.replace('_',' ')}</div>
              <div className="cat-top" style={{fontSize:13,marginBottom:4}}>{data.top_performer}</div>
              <div style={{fontSize:10,color:'var(--text-muted)'}}>{data.total} evaluations</div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
};

/* ══════════════════════════════════════════════════
   MODELS PAGE
══════════════════════════════════════════════════ */
const Models = () => {
  const modelIcons = ['◈','◉','◎','◇','◆','◊','⬡','⬢','◐','◑','⬟','⬠','◍','◌','⊕','⊗','⊘','⊙','⊚'];
  const models = TRACKER_DATA.leaderboard.map((m, i) => ({
    ...m,
    icon: modelIcons[i % modelIcons.length],
    winRate: m.evaluations > 0 ? ((m.wins/m.evaluations)*100).toFixed(1) : '0.0'
  }));

  return (
    <>
      <div className="welcome animate-in">
        <h1>Model Registry</h1>
        <p>{TRACKER_DATA.stats.models_tested} models benchmarked in Phase 2 · 10×10 peer matrix evaluation</p>
      </div>
      <div className="models-grid">
        {models.map((m, i) => (
          <div key={m.model_key} className={`model-card animate-in animate-delay-${(i%4)+1}`}>
            <div className="model-card-header">
              <div className="model-card-icon" style={{fontSize:18}}>{m.icon}</div>
              <div>
                <div className="model-card-name">{m.model}</div>
                <div className="model-card-key">{m.model_key}</div>
              </div>
            </div>
            <div className="model-stats-grid">
              <div className="model-stat-item">
                <div className="model-stat-label">Avg Score</div>
                <div className="model-stat-value purple">{m.score.toFixed(2)}</div>
              </div>
              <div className="model-stat-item">
                <div className="model-stat-label">Wins</div>
                <div className="model-stat-value green">{m.wins}</div>
              </div>
              <div className="model-stat-item">
                <div className="model-stat-label">Evaluations</div>
                <div className="model-stat-value">{m.evaluations}</div>
              </div>
              <div className="model-stat-item">
                <div className="model-stat-label">Win Rate</div>
                <div className={`model-stat-value ${parseFloat(m.winRate) > 10 ? 'green' : ''}`}>{m.winRate}%</div>
              </div>
            </div>
            <span className={`win-rate-pill ${parseFloat(m.winRate) > 10 ? 'high' : 'low'}`}>
              {parseFloat(m.winRate) > 10 ? '↑ High performer' : '○ Standard'}
            </span>
          </div>
        ))}
      </div>
    </>
  );
};

/* ══════════════════════════════════════════════════
   ANALYTICS PAGE
══════════════════════════════════════════════════ */
const Analytics = () => {
  /* Win rates per category */
  const catWinRates = Object.entries(TRACKER_DATA.categories).map(([cat, data]) => {
    const catEvals = TRACKER_DATA.evaluations.filter(e => e.category === cat);
    const topModel = TRACKER_DATA.leaderboard.find(m => m.model === data.top_performer);
    const topWins = catEvals.filter(e => e.winner === data.top_performer).length;
    const rate = catEvals.length > 0 ? (topWins / catEvals.length) * 100 : 0;
    return {cat: cat.replace('_',' '), rate: Math.round(rate), top: data.top_performer};
  });

  /* Model performance by score */
  const topByScore = [...TRACKER_DATA.leaderboard].sort((a,b) => b.score - a.score).slice(0,8);
  const maxScore = topByScore[0].score;

  /* Score distribution */
  const scores = TRACKER_DATA.evaluations.map(e => e.score).filter(s => s <= 15);
  const bins = [{range:'8.0–8.5',count:0},{range:'8.5–9.0',count:0},{range:'9.0–9.5',count:0},{range:'9.5–10.0',count:0}];
  scores.forEach(s => {
    if (s >= 8 && s < 8.5) bins[0].count++;
    else if (s >= 8.5 && s < 9.0) bins[1].count++;
    else if (s >= 9.0 && s < 9.5) bins[2].count++;
    else if (s >= 9.5 && s <= 10.0) bins[3].count++;
  });
  const maxBin = Math.max(...bins.map(b => b.count));

  /* Judge diversity — which models win per category */
  const uniqueWinners = new Set(TRACKER_DATA.evaluations.map(e => e.winner)).size;

  return (
    <>
      <div className="welcome animate-in">
        <h1>Analytics</h1>
        <p>Aggregated insights from {TRACKER_DATA.total_evaluations} evaluations · {TRACKER_DATA.stats.total_api_calls.toLocaleString()} API calls analyzed</p>
      </div>

      <div className="stat-grid" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <div className="stat-card animate-in animate-delay-1">
          <div className="stat-label">Unique Winners</div>
          <div className="stat-value">{uniqueWinners}</div>
          <div className="stat-change positive">No single dominant model</div>
        </div>
        <div className="stat-card green animate-in animate-delay-2">
          <div className="stat-label">Avg Consensus</div>
          <div className="stat-value">{TRACKER_DATA.stats.avg_consensus}%</div>
          <div className="stat-change positive">Judges agree often</div>
        </div>
        <div className="stat-card orange animate-in animate-delay-3">
          <div className="stat-label">Evaluations/Day</div>
          <div className="stat-value">{(TRACKER_DATA.total_evaluations / 60).toFixed(1)}</div>
          <div className="stat-change positive">Consistent cadence</div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
        {/* Top performers by avg score */}
        <div className="card animate-in animate-delay-2">
          <div className="card-header">
            <span className="card-title">Top Models by Avg Score</span>
          </div>
          {topByScore.map((m, i) => (
            <div key={m.model_key} className="win-rate-item">
              <span className="win-rate-label" style={{minWidth:160,fontSize:11}}>{m.model}</span>
              <div className="win-rate-bar">
                <div className="win-rate-fill" style={{width:`${(m.score/maxScore)*100}%`}}/>
              </div>
              <span className="win-rate-value">{m.score.toFixed(2)}</span>
            </div>
          ))}
        </div>

        {/* Category dominance */}
        <div className="card animate-in animate-delay-3">
          <div className="card-header">
            <span className="card-title">Category Leader Win Rate</span>
          </div>
          {catWinRates.map(item => (
            <div key={item.cat} className="win-rate-item">
              <span className="win-rate-label">{item.cat}</span>
              <div className="win-rate-bar">
                <div className="win-rate-fill" style={{width:`${item.rate}%`}}/>
              </div>
              <span className="win-rate-value">{item.rate}%</span>
            </div>
          ))}
          <div style={{fontSize:10,color:'var(--text-muted)',marginTop:12,letterSpacing:'.05em'}}>
            % of category evals won by top model
          </div>
        </div>
      </div>

      {/* Score distribution */}
      <div className="card animate-in animate-delay-4">
        <div className="card-header">
          <span className="card-title">Score Distribution (normal evals, excl. outliers)</span>
        </div>
        <div style={{display:'flex',alignItems:'flex-end',gap:12,height:100,padding:'0 8px'}}>
          {bins.map(b => (
            <div key={b.range} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <div style={{fontSize:10,color:'var(--accent-glow)',fontWeight:600}}>{b.count}</div>
              <div style={{
                width:'100%',
                height:`${(b.count/maxBin)*80}px`,
                background:'linear-gradient(180deg,var(--accent-primary),var(--accent-secondary))',
                minHeight:4
              }}/>
              <div style={{fontSize:9,color:'var(--text-muted)',letterSpacing:'.04em',textAlign:'center'}}>{b.range}</div>
            </div>
          ))}
        </div>
        <div style={{marginTop:16,padding:'12px 0',borderTop:'1px solid var(--border-subtle)',display:'flex',gap:24,flexWrap:'wrap'}}>
          {[
            {label:'Min Score', val: Math.min(...scores).toFixed(2)},
            {label:'Max Score', val: Math.max(...TRACKER_DATA.evaluations.map(e=>e.score)).toFixed(2)},
            {label:'Avg Score', val: (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2)},
            {label:'Evaluations', val: TRACKER_DATA.evaluations.length},
          ].map(item => (
            <div key={item.label}>
              <div style={{fontSize:9,color:'var(--text-muted)',letterSpacing:'.1em',marginBottom:2}}>{item.label}</div>
              <div style={{fontSize:14,color:'var(--accent-glow)',fontWeight:600}}>{item.val}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{marginTop:20,display:'flex',gap:12,flexWrap:'wrap'}}>
        <a href="https://themultivac.substack.com" target="_blank" rel="noopener" className="btn btn-secondary">Read Full Reports on Substack</a>
        <a href="https://github.com/themultivac" target="_blank" rel="noopener" className="btn btn-secondary">Raw Data on GitHub</a>
      </div>
    </>
  );
};

/* ══════════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════════ */
const App = () => {
  const [active, setActive] = useState('home');
  const [selectedEval, setSelectedEval] = useState(null);

  const pages = {
    home:        {title:'THE MULTIVAC · DAILY AI ORACLE',        component: () => <HomePage setActive={setActive} setSelectedEval={setSelectedEval}/>},
    dashboard:   {title:'COMMAND CENTER',                         component: () => <Dashboard setActive={setActive} setSelectedEval={setSelectedEval}/>},
    results:     {title:'EVALUATION RESULTS',                     component: () => <Results selectedEval={selectedEval} setActive={setActive}/>},
    history:     {title:'EVALUATION HISTORY',                     component: () => <History setActive={setActive} setSelectedEval={setSelectedEval}/>},
    leaderboard: {title:'MODEL LEADERBOARD',                      component: () => <Leaderboard/>},
    models:      {title:'MODEL REGISTRY',                         component: () => <Models/>},
    analytics:   {title:'ANALYTICS',                              component: () => <Analytics/>},
  };

  const CurrentPage = pages[active].component;

  return (
    <div style={{display:'flex',height:'100vh',width:'100%'}}>
      <Sidebar active={active} setActive={setActive}/>
      <div className="main">
        <Header title={pages[active].title}/>
        <div className="content">
          <CurrentPage key={active}/>
        </div>
        <Footer/>
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
