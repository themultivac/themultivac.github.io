<head>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/ailerons" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E◈%3C/text%3E%3C/svg%3E">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg-primary:#000;--bg-secondary:#0A0A0A;--bg-card:#111;--accent-primary:#8B5CF6;--accent-secondary:#6D28D9;--accent-glow:#A855F7;--text-primary:#FFF;--text-secondary:#A1A1AA;--text-muted:#71717A;--success:#22C55E;--warning:#F59E0B;--error:#EF4444;--border:#2D1B4E;--border-subtle:#1F1F1F}
    body{background:var(--bg-primary);color:var(--text-primary);font-family:'JetBrains Mono',monospace;min-height:100vh}
    .ailerons{font-family:'Ailerons',sans-serif;letter-spacing:.15em;text-transform:uppercase}
    .container{display:flex;min-height:100vh}
    .sidebar{width:240px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100}
    .logo{padding:24px;border-bottom:1px solid var(--border-subtle)}
    .logo-text{font-family:'Ailerons',sans-serif;font-size:20px;letter-spacing:.3em;color:var(--accent-primary);text-shadow:0 0 20px rgba(139,92,246,.5)}
    .logo-sub{font-size:10px;color:var(--text-muted);letter-spacing:.2em;margin-top:4px}
    .nav{flex:1;padding:16px 0}
    .nav-item{display:flex;align-items:center;gap:12px;padding:14px 24px;color:var(--text-secondary);cursor:pointer;transition:all .15s ease;border-left:2px solid transparent;font-size:13px}
    .nav-item:hover{background:rgba(139,92,246,.1);color:var(--text-primary);border-left-color:var(--accent-primary)}
    .nav-item.active{background:rgba(139,92,246,.15);color:var(--accent-primary);border-left-color:var(--accent-primary)}
    .nav-icon{width:18px;text-align:center}
    .main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh}
    .header{height:60px;background:var(--bg-secondary);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:50}
    .header-title{font-family:'Ailerons',sans-serif;font-size:14px;letter-spacing:.2em;color:var(--text-secondary)}
    .content{flex:1;padding:32px;overflow-y:auto}
    .card{background:var(--bg-card);border:1px solid var(--border-subtle);padding:24px;transition:all .15s ease}
    .card:hover{border-color:var(--border);box-shadow:0 0 30px rgba(139,92,246,.1)}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .card-title{font-family:'Ailerons',sans-serif;font-size:12px;letter-spacing:.2em;color:var(--text-secondary)}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
    .stat-card{background:var(--bg-card);border:1px solid var(--border-subtle);padding:24px;border-left:3px solid var(--accent-primary);transition:all .15s ease}
    .stat-card:hover{box-shadow:0 0 30px rgba(139,92,246,.15);transform:translateY(-2px)}
    .stat-label{font-size:11px;letter-spacing:.15em;color:var(--text-muted);margin-bottom:8px}
    .stat-value{font-family:'Ailerons',sans-serif;font-size:32px;color:var(--text-primary);letter-spacing:.1em}
    .stat-change{font-size:12px;margin-top:8px}
    .stat-change.positive{color:var(--success)}
    .table{width:100%;border-collapse:collapse}
    .table-row{border-bottom:1px solid var(--border-subtle);transition:all .15s ease;cursor:pointer}
    .table-row:hover{background:rgba(139,92,246,.08)}
    .table-cell{padding:16px;font-size:13px}
    .table-cell.id{color:var(--accent-primary);font-weight:600;width:120px}
    .table-cell.date{color:var(--text-muted);width:80px;text-align:right}
    .table-cell.winner{color:var(--success)}
    .table-cell.category{color:var(--accent-glow);font-size:11px;text-transform:uppercase;width:120px}
    .table-cell.score{color:var(--accent-primary);font-weight:600;width:60px}
    .leaderboard-item{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border-subtle)}
    .leaderboard-rank{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text-muted)}
    .leaderboard-rank.top{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff}
    .leaderboard-model{flex:1;font-size:13px}
    .leaderboard-bar-container{flex:2;height:20px;background:var(--bg-secondary)}

    .btn{padding:12px 24px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;transition:all .15s ease;border:none;text-transform:uppercase}
    .btn-primary{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff;box-shadow:0 0 20px rgba(139,92,246,.3)}

    .btn-secondary{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
    .btn-secondary:hover{background:rgba(139,92,246,.1);color:var(--text-primary);border-color:var(--accent-primary)}
    .winner-card{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(109,40,217,.1));border:2px solid var(--accent-primary);padding:32px;margin-bottom:24px;box-shadow:0 0 40px rgba(139,92,246,.2)}
    .winner-badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-primary);color:#fff;padding:6px 14px;font-size:11px;letter-spacing:.15em;margin-bottom:16px}
    .winner-model{font-family:'Ailerons',sans-serif;font-size:28px;letter-spacing:.1em;margin-bottom:12px}
    .winner-score-bar{flex:1;height:12px;background:var(--bg-card);max-width:400px}
    .winner-score-fill{height:100%;background:linear-gradient(90deg,var(--accent-secondary),var(--accent-primary),var(--accent-glow))}
    .winner-score-value{font-size:24px;font-weight:600;color:var(--accent-glow);margin-left:16px}
    .welcome{margin-bottom:32px}
    .welcome h1{font-family:'Ailerons',sans-serif;font-size:28px;letter-spacing:.1em;margin-bottom:8px}
    .welcome p{color:var(--text-muted);font-size:14px}
    .filter-select{background:var(--bg-secondary);border:1px solid var(--border-subtle);padding:8px 12px;color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer}
    .pagination{display:flex;align-items:center;gap:8px;margin-top:20px;justify-content:center}
    .page-btn{width:32px;height:32px;background:var(--bg-secondary);border:1px solid var(--border-subtle);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease}
    .page-btn:hover{border-color:var(--accent-primary);color:var(--text-primary)}
    .page-btn.active{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff}
    .footer{height:40px;background:var(--bg-secondary);border-top:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:11px;color:var(--text-muted)}
    .status-dot{width:8px;height:8px;background:var(--success);animation:pulse 2s infinite;display:inline-block;margin-right:8px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .animate-in{animation:fadeSlideIn .3s ease forwards;opacity:0}
    @keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .animate-delay-1{animation-delay:.1s}.animate-delay-2{animation-delay:.2s}.animate-delay-3{animation-delay:.3s}.animate-delay-4{animation-delay:.4s}
    .question-preview{font-size:12px;color:var(--text-secondary);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:1200px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.stat-grid{grid-template-columns:1fr}}
  </style>
</head>

      const sorted=[...TRACKER_DATA.leaderboard].sort((a,b)=>{if(sortBy==='wins')return b.wins-a.wins;if(sortBy==='evaluations')return b.evaluations-a.evaluations;return b.score-a.score;});
      const maxScore=Math.max(...sorted.map(m=>m.score));
      return(<><div className="welcome animate-in" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}><div><h1 className="ailerons">Model Leaderboard</h1><p>Rankings across {TRACKER_DATA.total_evaluations} evaluations</p></div><select className="filter-select" value={sortBy} onChange={e=>setSortBy(e.target.value)}><option value="score">Sort by Score</option><option value="wins">Sort by Wins</option><option value="evaluations">Sort by Evaluations</option></select></div><div className="card animate-in animate-delay-1">{sorted.map((item,index)=>(<div key={item.model_key} className="leaderboard-item" style={{padding:'16px 0'}}><div className={`leaderboard-rank ${index===0?'top':''}`}>{index+1}</div><div className="leaderboard-model" style={{minWidth:'200px'}}><div>{item.model}</div><div style={{fontSize:'10px',color:'var(--text-muted)'}}>{item.evaluations} evals</div></div><div className="leaderboard-bar-container"><div className="leaderboard-bar" style={{width:`${(item.score/maxScore)*100}%`}}/></div><div className="leaderboard-score">{item.score.toFixed(2)}</div><div className="leaderboard-wins">{item.wins} wins</div></div>))}</div><div className="card animate-in animate-delay-2" style={{marginTop:'24px'}}><div className="card-header"><span className="card-title">CATEGORY SPECIALISTS</span></div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'16px'}}>{Object.entries(TRACKER_DATA.categories).map(([cat,data])=>(<div key={cat} style={{background:'var(--bg-secondary)',padding:'16px'}}><div style={{fontSize:'10px',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:'8px'}}>{cat.replace('_',' ')}</div><div style={{fontSize:'14px',color:'var(--success)',marginBottom:'4px'}}>{data.top_performer}</div><div style={{fontSize:'11px',color:'var(--text-muted)'}}>{data.total} evaluations</div></div>))}</div></div></>);
    };
    
    const Models=()=>{
      const modelDetails=TRACKER_DATA.leaderboard.map(m=>({...m,winRate:m.evaluations>0?((m.wins/m.evaluations)*100).toFixed(1):0}));
      return(<><div className="welcome animate-in"><h1 className="ailerons">Model Registry</h1><p>{TRACKER_DATA.stats.models_tested} models evaluated in this benchmark</p></div><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'20px'}}>{modelDetails.map((model,index)=>(<div key={model.model_key} className={`card animate-in animate-delay-${(index%4)+1}`}><div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'16px'}}><div style={{width:'40px',height:'40px',background:'linear-gradient(135deg,var(--accent-primary),var(--accent-secondary))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}}>{index+1}</div><div><div style={{fontSize:'14px',fontWeight:600}}>{model.model}</div><div style={{fontSize:'11px',color:'var(--text-muted)'}}>{model.model_key}</div></div></div><div style={{background:'var(--bg-secondary)',padding:'12px',marginBottom:'12px'}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:'8px'}}><span style={{fontSize:'11px',color:'var(--text-muted)'}}>Avg Score</span><span style={{fontSize:'11px',color:'var(--accent-glow)'}}>{model.score.toFixed(2)}</span></div><div style={{display:'flex',justifyContent:'space-between',marginBottom:'8px'}}><span style={{fontSize:'11px',color:'var(--text-muted)'}}>Wins</span><span style={{fontSize:'11px',color:'var(--success)'}}>{model.wins}</span></div><div style={{display:'flex',justifyContent:'space-between',marginBottom:'8px'}}><span style={{fontSize:'11px',color:'var(--text-muted)'}}>Evaluations</span><span style={{fontSize:'11px'}}>{model.evaluations}</span></div><div style={{display:'flex',justifyContent:'space-between'}}><span style={{fontSize:'11px',color:'var(--text-muted)'}}>Win Rate</span><span style={{fontSize:'11px',color:model.winRate>10?'var(--success)':'var(--text-secondary)'}}>{model.winRate}%</span></div></div></div>))}</div></>);
    };
    
    const App=()=>{
      const[activePage,setActivePage]=useState('dashboard');const[selectedEval,setSelectedEval]=useState(null);
      const pages={'dashboard':{title:'COMMAND CENTER',component:()=><Dashboard setActivePage={setActivePage} setSelectedEval={setSelectedEval}/>},'results':{title:'EVALUATION RESULTS',component:()=><Results selectedEval={selectedEval}/>},'history':{title:'EVALUATION HISTORY',component:()=><History setActivePage={setActivePage} setSelectedEval={setSelectedEval}/>},'leaderboard':{title:'LEADERBOARD',component:()=><Leaderboard/>},'models':{title:'MODEL REGISTRY',component:()=><Models/>}};
      const CurrentPage=pages[activePage].component;
      return(<div className="container"><Sidebar activePage={activePage} setActivePage={setActivePage}/><main className="main"><Header title={pages[activePage].title}/><div className="content"><CurrentPage/></div><Footer/></main></div>);
    };
    
    const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
  </script>
</body>
</html>
